name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
          cache-to: type=gha
          cache-from: type=gha

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Restore Go build cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: release-go-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_ORG: libredesk
          GITHUB_ORG: ${{ github.repository_owner }}
